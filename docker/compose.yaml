# Dev env HA + Mosquitto (mirroir pc-ha, sans Zigbee2MQTT)
# Usage: `make env-up` puis http://localhost:8123 (test/test)
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: basic-ha-homeassistant
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    ports:
      - "8123:8123"
    volumes:
      - ha_config:/config
      - ./ha_config/configuration.yaml:/config/configuration.yaml:ro
      - ../custom_components:/config/custom_components:ro
    environment:
      TZ: Europe/Paris

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: basic-ha-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro

  # One-shot: onboarding test/test + entrée MQTT (idempotent)
  seed:
    image: python:3.12-slim
    container_name: basic-ha-seed
    restart: "no"
    depends_on:
      homeassistant:
        condition: service_started
    volumes:
      - ./seed.py:/seed.py:ro
    environment:
      HA_URL: http://homeassistant:8123
      HA_USERNAME: test
      HA_PASSWORD: test
      BROKER_HOST: mosquitto
      BROKER_PORT: "1883"
    command: ["python3", "/seed.py"]

volumes:
  ha_config:
