name: Release (HACS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant
          pip install -r requirements-dev.txt

      - name: Validate (hassfest + hacs + tests)
        run: |
          hassfest --integration-path custom_components/basic_ha || python -m homeassistant.scripts.hassfest --integration-path custom_components/basic_ha || echo "hassfest skip"
          pytest -q --asyncio-mode=auto

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
        continue-on-error: true

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          MANIFEST=$(jq -r .version custom_components/basic_ha/manifest.json)
          echo "tag=$TAG manifest=$MANIFEST"
          [ "$TAG" = "$MANIFEST" ] || (echo "Tag v$TAG != manifest $MANIFEST" && exit 1)

      - name: Build HACS zip
        run: |
          zip -r basic_ha.zip custom_components/basic_ha -x "*/__pycache__/*" "*/.pytest_cache/*"
          unzip -l basic_ha.zip | head -n 30
          sha256sum basic_ha.zip > basic_ha.zip.sha256
          cat basic_ha.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            basic_ha.zip
            basic_ha.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
