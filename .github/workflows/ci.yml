name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        ha-version: ["2025.11.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.ha-version }}" = "latest" ]; then
            pip install homeassistant --upgrade
          else
            pip install homeassistant==${{ matrix.ha-version }}
          fi
          pip install -r requirements-dev.txt
      - name: Hassfest
        run: |
          hassfest --integration-path custom_components/basic_ha || python -m homeassistant.scripts.hassfest --integration-path custom_components/basic_ha || echo "hassfest not available, skipping"
      - name: HACS validate
        uses: hacs/action@main
        with:
          category: integration
        continue-on-error: true
      - name: Pytest
        run: pytest -v --asyncio-mode=auto

